           '<p class="note">Fuego y Arcoíris usan sus propios colores.</p>'}],
          ['⚽','Pelota',function(){return chips('ball.skin','Estilo')+col('ball.color','Color')+chips('ball.trail','Estela')+
           '<div class="row"><label>Foto</label><button class="sm" onclick="pick(\'ball.photo\')">📷 Elegir foto</button><button class="sm" onclick="set(\'ball.photo\',\'\');render()">Quitar</button></div>'}],
          ['📺','Pantalla',function(){return chips('screen.stretch','Estirado')+chips('screen.quality','Calidad')+chips('screen.fps','FPS')+chk('screen.noads','Sin anuncios')+chk('screen.eco','Modo ahorro')+
           '<p class="note">El estirado 4:3 agranda todo a lo ancho sin cambiar la resolución del teléfono (se desactiva solo mientras sale el captcha). Calidad baja y 30–60 FPS = más rendimiento. Los cambios se aplican al recargar el juego.</p>'}],
          ['🎮','Controles',function(){return rng('pad.scale','Tamaño',.6,1.6,.05)+rng('pad.alpha','Opacidad',.2,1,.05)+chk('pad.left','Zurdo')+chk('pad.vib','Vibración')+
           sub('Precisión')+rng('ctrl.dz','Zona muerta',.05,.6,.05)+chk('ctrl.snap','8 direcciones')+rng('ctrl.minKick','Toque patada ms',0,150,10)+chips('ctrl.mode','Teclas')+
           '<p class="note">Los controles solo capturan toques durante la partida: en la lista de salas y en el captcha tocás directo la pantalla. 🎮 los oculta, 💬 abre chat rápido, ☰ abre este menú.</p>'}],
          ['📡','Red',function(){return chips('ext','Atajos')+rng('ext','Extrapolation',-200,200,5)+
           '<div class="row"><label>Valor</label><b id="extv" style="font-size:16px">'+C.ext+' ms</b><button class="sm" onclick="B.cmd(\'/extrapolation \'+C.ext)">Aplicar ahora</button></div>'+
           '<p class="note">Se aplica solo al entrar a una sala. Con ping alto probá valores positivos (20–60); si el juego se siente adelantado, bajalo.</p>'}],
          ['🧲','Control',function(){return sub('Auto-patada')+chips('assist.mode','Modo')+chips('assist.where','Dónde')+rng('assist.range','Alcance',0,1.5,.1)+rng('assist.delay','Espera ms',80,400,10)+
           sub('Ayudas visuales')+chk('assist.gball','Guía de pelota')+chk('assist.gring','Aro de patada')+
           sub('Física de control (tu sala)')+chk('ctrl.stadium','Cancha Control')+
           '<p class="note">Auto-patada: patea sola cuando tu jugador toca la pelota (ventaja injusta en salas ajenas; por defecto solo en tu sala de entrenamiento). Necesita tu avatar activo para detectarte.<br>Guía de pelota: línea hacia donde va. Aro de patada: se pone verde cuando la pelota está al alcance.<br>Cancha Control: en tu sala, al tocar «Elegir estadio → Cargar», la app carga sola un futsal con paredes que casi no rebotan (la pelota se desliza recta) y pelota más pegada al jugador. La física la decide el dueño de la sala: no se puede cambiar en salas ajenas.</p>'}],
          ['💬','Chat',function(){return sub('Frases rápidas (💬 en partida)')+[0,1,2,3,4,5].map(function(i){return txt('chat.quick.'+i,'Frase '+(i+1),'',20)}).join('')+
           rng('chat.alpha','Opacidad',.2,1,.05)+rng('chat.scale','Tamaño',.5,1.6,.1)+chk('chat.collapsed','Empezar plegado')+
           '<div class="row"><button class="sm" onclick="B.cmd(\'@chat:reset\')">Reiniciar posición</button></div>'+
           '<p class="note">En partida, el chat tiene una barra ⠿ arriba: arrastrala para moverlo, ▾ lo pliega, A− / A+ cambian el tamaño.</p>'}]
          ];

          function get(p){return p.split('.').reduce(function(o,k){return o[k]},C)}
          var pt=0;
          function persist(){clearTimeout(pt);pt=setTimeout(function(){B.save(JSON.stringify(C))},250)}
          function set(p,v){
            if(p=='ext'){var l=$('extv');if(l)l.textContent=v+' ms'}
            var a=p.split('.'),l=a.pop(),o=a.reduce(function(o,k){return o[k]},C);
            o[l]=v;dirty=true;persist();
            if(p=='photo'||p=='ball.photo')loadImgs();
          }
          function cv(v){return v!==''&&!isNaN(v)?+v:v}
          function mark(e,v){[].forEach.call(e.children,function(c){c.classList.toggle('on',cv(c.dataset.v)===v)})}
          function bind(){
            $('pane').querySelectorAll('[data-k]').forEach(function(e){
              var k=e.dataset.k,v=get(k);
              if(e.classList.contains('chips')){
                mark(e,v);
                e.onclick=function(ev){var t=ev.target;if(t.dataset.v==null)return;set(k,cv(t.dataset.v));mark(e,get(k));if(k=='ext')render()};
              }else if(e.type=='checkbox'){e.checked=!!v;e.onchange=function(){set(k,e.checked)}}
              else{e.value=v;e.oninput=function(){set(k,e.type=='range'?+e.value:e.value)}}
            });
          }
          function render(i){
            if(i!=null)cur=i;
            $('tabs').innerHTML=TABS.map(function(t,j){return'<b class="'+(j==cur?'on':'')+'" onclick="render('+j+')">'+t[0]+' '+t[1]+'</b>'}).join('');
            $('pane').innerHTML=TABS[cur][2]();
            bind();
          }
          function pick(k){
            var f=document.createElement('input');f.type='file';f.accept='image/*';
            f.onchange=function(){
              if(!f.files[0])return;
              var fr=new FileReader();
              fr.onload=function(){
                var im=new Image();
                im.onload=function(){
                  var c=document.createElement('canvas');c.width=c.height=128;
                  var s=Math.min(im.width,im.height);
                  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
                  set(k,c.toDataURL('image/jpeg',.85));
                  if(k=='photo')set('photoOn',true);
                  render();
                };
                im.src=fr.result;
              };
              fr.readAsDataURL(f.files[0]);
            };
            f.click();
          }
          function start(mode){C.auto={mode:mode};B.play(JSON.stringify(C),true);dirty=false}
          function joinUrl(u){C.auto={mode:'join'};B.join(JSON.stringify(C),u);dirty=false}
          function goLink(i){
            var u=i<0?(C.link||'').trim():C.links[i].u;
            if(!okUrl(u)){toast('Pegá un enlace de haxball.com');return}
            joinUrl(u);
          }
          function addLink(){
            var u=(C.link||'').trim(),n=(C.linkn||'').trim();
            if(!okUrl(u)){toast('Pegá un enlace de haxball.com');return}
            if(C.links.length>=8)C.links.shift();
            C.links.push({n:n||u.replace(/^https:\/\/(www\.)?/,''),u:u});
            C.link='';C.linkn='';B.save(JSON.stringify(C));render();toast('Sala guardada');
          }
          function delLink(i){C.links.splice(i,1);B.save(JSON.stringify(C));render()}
          $('go').onclick=function(){
            if(B.started()&&!dirty){B.play(JSON.stringify(C),false)}
            else{C.auto={mode:'join'};B.play(JSON.stringify(C),true);dirty=false}
          };
          window.onShow=function(){$('go').textContent=(B.started()&&!dirty)?'▶ VOLVER AL JUEGO':(B.started()?'↻ APLICAR Y JUGAR':'▶ JUGAR')};

          /* ---------- portada: pelota épica + HAXBALL MOBILE ---------- */
          function hero(t){
            var cv=$('hero');if(!cv)return;
            var dp=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
            if(!w)return;
            if(cv.width!==Math.round(w*dp)){cv.width=Math.round(w*dp);cv.height=Math.round(h*dp)}
            var c=cv.getContext('2d'),s=t/1000,i,a,g,px,py;
            c.setTransform(dp,0,0,dp,0,0);
            g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#0a1c48');g.addColorStop(.5,'#2b0f63');g.addColorStop(1,'#05070f');
            c.fillStyle=g;c.fillRect(0,0,w,h);
            var R=h*.3,bx=w-h*.78,by=h*.54;
            c.save();c.globalCompositeOperation='lighter';
            for(i=0;i<12;i++){a=i*Math.PI/6+s*.3;c.fillStyle='rgba(110,170,255,'+(.05+.04*Math.sin(s*2+i))+')';c.beginPath();c.moveTo(bx,by);c.arc(bx,by,w,a,a+.13);c.closePath();c.fill()}
            g=c.createRadialGradient(bx,by,R*.3,bx,by,R*2.8);g.addColorStop(0,'rgba(255,160,40,.8)');g.addColorStop(.45,'rgba(255,70,20,.25)');g.addColorStop(1,'rgba(255,60,0,0)');
            c.fillStyle=g;c.fillRect(0,0,w,h);
            for(i=0;i<3;i++){a=(s*.6+i/3)%1;c.globalAlpha=(1-a)*.7;c.strokeStyle='#7fd4ff';c.lineWidth=2;c.beginPath();c.arc(bx,by,R*(1+a*1.8),0,6.2832);c.stroke()}
            c.restore();
            HBX.aura(c,bx,by,R,{type:'fire',color:'#ff8a00',size:1.5,speed:1.2},s);
            HBX.ball(c,bx,by,R,{skin:'fire',color:'#ffd400'},null);
            c.save();c.beginPath();c.arc(bx,by,R,0,6.2832);c.clip();c.fillStyle='rgba(30,8,0,.78)';
            for(i=0;i<5;i++){
              a=i*1.2566+s*.9;px=bx+Math.cos(a)*R*.62;py=by+Math.sin(a)*R*.62;
              c.beginPath();for(var j=0;j<5;j++){var b2=j*1.2566+a;c.lineTo(px+Math.cos(b2)*R*.27,py+Math.sin(b2)*R*.27)}c.closePath();c.fill();
            }
            c.restore();
            g=c.createRadialGradient(bx-R*.4,by-R*.45,0,bx-R*.4,by-R*.45,R*.6);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
            c.fillStyle=g;c.beginPath();c.arc(bx,by,R,0,6.2832);c.fill();
            HBX.aura(c,bx,by,R,{type:'bolt',color:'#8fe3ff',size:1.8,speed:1},s);
            var tx=Math.max(12,w*.04),fs=Math.round(Math.min(h*.4,w*.11));
            c.textAlign='left';c.textBaseline='alphabetic';
            c.font='900 italic '+fs+'px system-ui,sans-serif';
            g=c.createLinearGradient(0,h*.2,0,h*.62);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#7fc0ff');
            c.shadowColor='#4da3ff';c.shadowBlur=18;c.fillStyle=g;c.fillText('HAXBALL',tx,h*.58);
            c.shadowBlur=0;c.font='800 '+Math.round(fs*.4)+'px system-ui,sans-serif';c.fillStyle='#ffb347';
            c.fillText('M  O  B  I  L  E',tx+4,h*.58+fs*.52);
          }

          /* ---------- vista previa ---------- */
          var pc=$('pv').getContext('2d'),IP=new Image(),IB=new Image(),tr=[];
          function loadImgs(){IP.src=C.photo||'';IB.src=C.ball.photo||''}
          function ok(i){return i.complete&&i.naturalWidth>0}
          function pv(t){
            var c=pc,s=t/1000,px=72,py=112,r=34,photo=C.photoOn&&ok(IP);
            c.clearRect(0,0,220,220);
            if(photo)HBX.cimg(c,IP,px,py,r);
            else if(C.jersey.on)HBX.jersey(c,px,py,r,C.jersey);
            else{c.fillStyle='#e56e56';c.beginPath();c.arc(px,py,r,0,6.2832);c.fill();c.lineWidth=3;c.strokeStyle='#000';c.stroke()}
            if(!photo){c.fillStyle='#fff';c.font='bold 20px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(C.avatar,px,py)}
            HBX.aura(c,px,py,r,C.aura,s);
            var bx=150+Math.cos(s*1.6)*20,by=150+Math.sin(s*1.1)*40,br=20;
            c.fillStyle='#fff';c.beginPath();c.arc(bx,by,br,0,6.2832);c.fill();c.lineWidth=2.5;c.strokeStyle='#000';c.stroke();
            HBX.trail(c,tr,bx,by,br,C.ball);
            HBX.ball(c,bx,by,br,C.ball,ok(IB)?IB:null);
          }

          /* ---------- lluvia + bucle (30 fps; se detiene al jugar) ---------- */
          var FX=1,run=0,rc=$('rain'),rx=rc.getContext('2d'),W,Hh,dr=[],rp=[],fl=0,lt=0;
          function rs(){W=rc.width=innerWidth;Hh=rc.height=innerHeight}
          rs();addEventListener('resize',rs);
          function nd(init){return{x:Math.random()*(W+200)-100,y:init?Math.random()*Hh:-30,l:12+Math.random()*20,v:11+Math.random()*10,a:.15+Math.random()*.4}}
          for(var q=0;q<80;q++)dr.push(nd(1));
          function loop(t){
            if(!FX){run=0;return}
            requestAnimationFrame(loop);
            if(t-lt<28)return;
            lt=t;
            rx.clearRect(0,0,W,Hh);
            if(fl>0){rx.fillStyle='rgba(190,215,255,'+fl*.2+')';rx.fillRect(0,0,W,Hh);fl-=.06}
            else if(Math.random()<.003)fl=1;
            rx.lineWidth=1.2;rx.lineCap='round';
            for(var i=0;i<dr.length;i++){
              var d=dr[i];
              rx.strokeStyle='rgba(160,200,255,'+d.a+')';rx.beginPath();rx.moveTo(d.x,d.y);rx.lineTo(d.x-d.l*.25,d.y+d.l);rx.stroke();
              d.y+=d.v*1.5;d.x-=d.v*.37;
              if(d.y>Hh){if(Math.random()<.4)rp.push({x:d.x,y:Hh-Math.random()*40,r:1,a:.5});dr[i]=nd(0)}
            }
            for(i=rp.length-1;i>=0;i--){
              var p=rp[i];
              rx.strokeStyle='rgba(160,200,255,'+p.a+')';rx.beginPath();rx.ellipse(p.x,p.y,p.r,p.r*.35,0,0,6.28);rx.stroke();
              p.r+=1.2;p.a-=.03;if(p.a<=0)rp.splice(i,1);
            }
            pv(t||0);
            if(cur==0)hero(t||0);
          }
          window.fx=function(on){FX=on;if(on&&!run){run=1;requestAnimationFrame(loop)}if(on)onShow()};
          loadImgs();render(0);onShow();fx(1);
          </script></body></html>
          EOF
