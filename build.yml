name: apk
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: 8.7}
      - run: |
          mkdir -p app/src/main/java/com/hazball/mobile app/src/main/assets app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name="HaxBallMobile"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins{id 'com.android.application' version '8.5.2' apply false}
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins{id 'com.android.application'}
          android{
            namespace 'com.hazball.mobile'
            compileSdk 34
            defaultConfig{applicationId 'com.hazball.mobile';minSdk 24;targetSdk 34;versionCode 3;versionName '3.0'}
            compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}
          }
          dependencies{
            implementation 'androidx.webkit:webkit:1.11.0'
            implementation 'androidx.core:core:1.13.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="HaxBall Mobile" android:icon="@drawable/ic_launcher" android:hardwareAccelerated="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true"
                android:screenOrientation="sensorLandscape"
                android:windowSoftInputMode="adjustResize"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#0A1430" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#331F6FEB" android:pathData="M54,54m-50,0a50,50 0 1,0 100,0a50,50 0 1,0 -100,0"/>
            <path android:fillColor="#554DA3FF" android:pathData="M54,54m-42,0a42,42 0 1,0 84,0a42,42 0 1,0 -84,0"/>
            <path android:fillColor="#FF9D00" android:pathData="M54,54m-34,0a34,34 0 1,0 68,0a34,34 0 1,0 -68,0"/>
            <path android:fillColor="#FFF6A0" android:pathData="M54,54m-29,0a29,29 0 1,0 58,0a29,29 0 1,0 -58,0"/>
            <path android:fillColor="#E22D00" android:pathData="M54,54m-22,0a22,22 0 1,0 44,0a22,22 0 1,0 -44,0"/>
            <path android:fillColor="#1A0800" android:pathData="M54,42 L65.4,50.3 L61,63.7 L47,63.7 L42.6,50.3 Z"/>
            <path android:strokeColor="#1A0800" android:strokeWidth="2.4" android:pathData="M54,42 L54,27 M65.4,50.3 L79,46 M61,63.7 L69,75 M47,63.7 L39,75 M42.6,50.3 L29,46"/>
            <path android:strokeColor="#7FD4FF" android:strokeWidth="2.5" android:pathData="M54,54m-34,0a34,34 0 1,0 68,0a34,34 0 1,0 -68,0"/>
          </vector>
          EOF
          cat > app/src/main/java/com/hazball/mobile/MainActivity.java <<'EOF'
          package com.hazball.mobile;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import androidx.webkit.ScriptHandler;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class MainActivity extends Activity {
            static final String URL = "https://www.haxball.com/play";
            static final String[] ADS = {"doubleclick", "googlesyndication", "googleadservices", "adinplay", "adsbygoogle",
              "google-analytics", "googletagmanager", "amazon-adsystem", "adnxs", "taboola", "outbrain", "criteo", "pubmatic",
              "rubiconproject", "openx.net", "smartadserver", "moatads", "adsrvr", "casalemedia", "adform", "venatus",
              "nitropay", "playwire", "snigel", "freestar", "aniview", "connatix"};
            WebView game, menu;
            Pad pad;
            TextView loading;
            ScriptHandler sh;
            SharedPreferences sp;
            String target = URL;
            volatile boolean started;
            volatile boolean blockAds = true;
            volatile boolean jsKeys = true;
            boolean stadiumCtl = true;
            long lastBack;
            ValueCallback<Uri[]> fileCb, gameCb;

            class Bridge {
              @JavascriptInterface public String get() { return sp.getString("cfg", "{}"); }
              @JavascriptInterface public void save(String j) { sp.edit().putString("cfg", j).apply(); }
              @JavascriptInterface public boolean started() { return started; }
              @JavascriptInterface public void play(String j, boolean reload) {
                sp.edit().putString("cfg", j).apply();
                runOnUiThread(() -> { if (reload) target = URL; launch(reload); });
              }
              @JavascriptInterface public void join(String j, String u) {
                sp.edit().putString("cfg", j).apply();
                runOnUiThread(() -> { target = okUrl(u) ? u : URL; launch(true); });
              }
              @JavascriptInterface public void quit() { runOnUiThread(() -> finish()); }
              @JavascriptInterface public void cmd(String t) { runOnUiThread(() -> say(t)); }
            }

            static boolean okUrl(String u) {
              try {
                Uri p = Uri.parse(u);
                String h = p.getHost();
                return "https".equals(p.getScheme()) && h != null && (h.equals("haxball.com") || h.endsWith(".haxball.com"));
              } catch (Exception e) { return false; }
            }

            /* User-Agent de escritorio con la MISMA version de Chromium del WebView (evita incoherencias que molestan al reCAPTCHA) */
            String ua() {
              String ver = "124.0.0.0";
              try {
                Matcher m = Pattern.compile("Chrome/([0-9.]+)").matcher(WebSettings.getDefaultUserAgent(this));
                if (m.find()) ver = m.group(1);
              } catch (Exception e) { }
              return "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/" + ver + " Safari/537.36";
            }

            void say(String t) {
              game.evaluateJavascript("window.__hbc&&__hbc(" + JSONObject.quote(t) + ")", null);
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= 28)
                getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              sp = getSharedPreferences("hz", 0);
              FrameLayout root = new FrameLayout(this);
              root.setBackgroundColor(0xFF05070D);

              CookieManager cm = CookieManager.getInstance();
              cm.setAcceptCookie(true);

              game = new WebView(this);
              cm.setAcceptThirdPartyCookies(game, true);
              WebSettings s = game.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setSupportZoom(false);
              s.setUserAgentString(ua());
              s.setSaveFormData(false);
              s.setGeolocationEnabled(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              game.setOverScrollMode(View.OVER_SCROLL_NEVER);
              game.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              game.setBackgroundColor(0xFF1A2125);
              game.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  if (blockAds) {
                    String h = r.getUrl().getHost();
                    if (h != null) for (String a : ADS)
                      if (h.contains(a)) return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream(new byte[0]));
                  }
                  return null;
                }
                /* bloquea redirecciones de anuncios que intentan sacar la pagina principal de haxball.com */
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  if (!r.isForMainFrame()) return false;
                  String sc = r.getUrl().getScheme();
                  if (sc == null || !(sc.equals("http") || sc.equals("https"))) return true;
                  String h = r.getUrl().getHost();
                  return !(h != null && (h.equals("haxball.com") || h.endsWith(".haxball.com")));
                }
                @Override public void onPageFinished(WebView v, String u) { loading.setVisibility(View.GONE); }
                @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                  if (r.isForMainFrame()) {
                    loading.setVisibility(View.GONE);
                    Toast.makeText(MainActivity.this, "Sin conexion con HaxBall. Revisa tu internet.", Toast.LENGTH_LONG).show();
                    started = false;
                    showMenu();
                  }
                }
              });
              game.setWebChromeClient(new WebChromeClient() {
                /* "Cargar estadio" dentro de la sala: si la Cancha Control esta activa se carga sola */
                @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (gameCb != null) gameCb.onReceiveValue(null);
                  gameCb = cb;
                  try {
                    if (stadiumCtl) {
                      Uri u = stadium();
                      if (u != null) {
                        gameCb = null;
                        cb.onReceiveValue(new Uri[]{u});
                        Toast.makeText(MainActivity.this, "Cancha Control cargada", Toast.LENGTH_SHORT).show();
                        return true;
                      }
                    }
                    Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                    i.addCategory(Intent.CATEGORY_OPENABLE);
                    i.setType("*/*");
                    startActivityForResult(Intent.createChooser(i, "Elegi un archivo"), 8);
                  } catch (Exception e) { gameCb = null; cb.onReceiveValue(null); }
                  return true;
                }
              });

              loading = new TextView(this);
              loading.setText("Cargando HaxBall...");
              loading.setTextColor(0xFFE8F1FF);
              loading.setTextSize(18);
              loading.setGravity(Gravity.CENTER);
              loading.setBackgroundColor(0xE605070D);
              loading.setVisibility(View.GONE);

              menu = new WebView(this);
              WebSettings m = menu.getSettings();
              m.setJavaScriptEnabled(true);
              m.setDomStorageEnabled(true);
              menu.setBackgroundColor(0xFF05070D);
              menu.addJavascriptInterface(new Bridge(), "HBApp");
              menu.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("image/*");
                  try { startActivityForResult(Intent.createChooser(i, "Elegi una imagen"), 7); }
                  catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
              });
              menu.loadUrl("file:///android_asset/menu.html");

              pad = new Pad(this, this::sendKey);
              pad.onSettings = this::showMenu;
              pad.onSay = this::say;
              pad.setVisibility(View.GONE);

              root.addView(game, new FrameLayout.LayoutParams(-1, -1));
              root.addView(loading, new FrameLayout.LayoutParams(-1, -1));
              root.addView(pad, new FrameLayout.LayoutParams(-1, -1));
              root.addView(menu, new FrameLayout.LayoutParams(-1, -1));
              setContentView(root);

              /* cada 400 ms pregunta a la pagina si hay una partida en curso: el pad solo captura toques jugando */
              game.postDelayed(new Runnable() {
                @Override public void run() {
                  if (started && menu.getVisibility() != View.VISIBLE)
                    game.evaluateJavascript("window.__hbs?__hbs():0", v -> pad.setPlaying("1".equals(v)));
                  game.postDelayed(this, 400);
                }
              }, 800);
            }

            Uri stadium() {
              try {
                File f = new File(getCacheDir(), "control.hbs");
                try (InputStream is = getAssets().open("control.hbs"); FileOutputStream os = new FileOutputStream(f)) {
                  byte[] buf = new byte[8192];
                  int r;
                  while ((r = is.read(buf)) > 0) os.write(buf, 0, r);
                }
                return Uri.fromFile(f);
              } catch (Exception e) { return null; }
            }

            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              super.onActivityResult(rq, rs, d);
              if (rq == 7 && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d));
                fileCb = null;
              } else if (rq == 8 && gameCb != null) {
                gameCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d));
                gameCb = null;
              }
            }

            String asset(String n) {
              try (InputStream is = getAssets().open(n)) {
                ByteArrayOutputStream bo = new ByteArrayOutputStream();
                byte[] buf = new byte[8192];
                int r;
                while ((r = is.read(buf)) > 0) bo.write(buf, 0, r);
                return bo.toString("UTF-8") + "\n;\n";
              } catch (Exception e) { return ""; }
            }

            void sendKey(int code, boolean down) {
              if (jsKeys) {
                int j = code == android.view.KeyEvent.KEYCODE_DPAD_LEFT ? 37 : code == android.view.KeyEvent.KEYCODE_DPAD_UP ? 38
                  : code == android.view.KeyEvent.KEYCODE_DPAD_RIGHT ? 39 : code == android.view.KeyEvent.KEYCODE_DPAD_DOWN ? 40 : 88;
                game.evaluateJavascript("window.__hbk&&__hbk(" + j + "," + (down ? 1 : 0) + ")", null);
              } else {
                long t = android.os.SystemClock.uptimeMillis();
                game.dispatchKeyEvent(new android.view.KeyEvent(t, t, down ? android.view.KeyEvent.ACTION_DOWN : android.view.KeyEvent.ACTION_UP, code, 0));
              }
            }

            void launch(boolean reload) {
              String cfg = sp.getString("cfg", "{}");
              try {
                JSONObject c = new JSONObject(cfg);
                JSONObject p = c.optJSONObject("pad");
                JSONObject k = c.optJSONObject("ctrl");
                JSONObject as = c.optJSONObject("assist");
                JSONObject ch = c.optJSONObject("chat");
                if (p != null) pad.apply((float) p.optDouble("scale", 1), (float) p.optDouble("alpha", 1), p.optBoolean("left", false), p.optBoolean("vib", true),
                  k == null ? .25f : (float) k.optDouble("dz", .25), k == null || k.optBoolean("snap", true), k == null ? 50 : k.optInt("minKick", 50));
                boolean assist = as != null && !"off".equals(as.optString("mode", "off"));
                jsKeys = assist || k == null || !"native".equals(k.optString("mode", "js"));
                stadiumCtl = k == null || k.optBoolean("stadium", true);
                JSONObject sc = c.optJSONObject("screen");
                blockAds = sc == null || sc.optBoolean("noads", true);
                if (ch != null) {
                  JSONArray q = ch.optJSONArray("quick");
                  if (q != null) {
                    ArrayList<String> l = new ArrayList<>();
                    for (int i = 0; i < q.length() && l.size() < 9; i++) {
                      String t = q.optString(i, "").trim();
                      if (!t.isEmpty()) l.add(t);
                    }
                    pad.setQuick(l.toArray(new String[0]));
                  }
                }
              } catch (Exception e) { }
              if (reload || !started) {
                if (sh != null) { sh.remove(); sh = null; }
                if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT))
                  sh = WebViewCompat.addDocumentStartJavaScript(game, "window.__HB=" + cfg + ";\n" + asset("common.js") + asset("hb.js"), Collections.singleton("*"));
                started = true;
                loading.setVisibility(View.VISIBLE);
                game.loadUrl(target);
              }
              menu.setVisibility(View.GONE);
              menu.evaluateJavascript("window.fx&&fx(0)", null);
              pad.setVisibility(View.VISIBLE);
              game.requestFocus();
            }

            void showMenu() {
              pad.releaseAll();
              pad.setPlaying(false);
              pad.setVisibility(View.GONE);
              menu.setVisibility(View.VISIBLE);
              menu.evaluateJavascript("window.fx&&fx(1)", null);
              menu.requestFocus();
            }

            void hideBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
            @Override protected void onPause() { super.onPause(); game.onPause(); CookieManager.getInstance().flush(); }
            @Override protected void onResume() { super.onResume(); game.onResume(); }
            @Override public void onBackPressed() {
              if (menu.getVisibility() != View.VISIBLE) { showMenu(); return; }
              if (started) { launch(false); return; }
              long n = System.currentTimeMillis();
              if (n - lastBack < 2000) finish();
              else { lastBack = n; Toast.makeText(this, "Toca atras otra vez para salir", Toast.LENGTH_SHORT).show(); }
            }
          }
          EOF
          cat > app/src/main/java/com/hazball/mobile/Pad.java <<'EOF'
          package com.hazball.mobile;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.HapticFeedbackConstants;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import java.util.function.Consumer;
          public class Pad extends View {
            interface Sink { void key(int code, boolean down); }
            static final int[] KC = {KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN};
            final Sink sink;
            final Handler hd = new Handler(Looper.getMainLooper());
            Runnable onSettings;
            Consumer<String> onSay;
            String[] quick = {"gg", "pasa", "dale", "bien!", "gracias", "uf"};
            boolean on = true, playing = false, lf = false, vib = true, snap = true, qOpen = false;
            int jid = -1, kid = -1, minKick = 50;
            long kt;
            float ox, oy, tx, ty, d, R, sc = 1, al = 1, dz = .25f;
            final boolean[] k = new boolean[4];
            final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
            final RectF rf = new RectF();

            Pad(Context c, Sink s) {
              super(c);
              sink = s;
              d = c.getResources().getDisplayMetrics().density;
              R = 60 * d;
              setFocusable(false);
              setFocusableInTouchMode(false);
            }
            void apply(float s, float a, boolean l, boolean v, float z, boolean sn, int mk) {
              sc = s; al = a; lf = l; vib = v; dz = z; snap = sn; minKick = mk;
              R = 60 * d * sc;
              invalidate();
            }
            void setQuick(String[] q) { if (q != null && q.length > 0) quick = q; }
            /* Solo captura toques cuando hay una partida en curso; en menus y salas deja pasar todo al juego (captcha, lista de salas...) */
            void setPlaying(boolean b) {
              if (playing == b) return;
              playing = b;
              if (!b) { qOpen = false; releaseAll(); }
              invalidate();
            }
            void key(int code, boolean down) { sink.key(code, down); }
            void kick(boolean down) {
              if (down) { kt = SystemClock.uptimeMillis(); key(KeyEvent.KEYCODE_X, true); }
              else {
                long w = minKick - (SystemClock.uptimeMillis() - kt);
                if (w > 0) hd.postDelayed(() -> key(KeyEvent.KEYCODE_X, false), w);
                else key(KeyEvent.KEYCODE_X, false);
              }
            }
            void dirs() {
              float dx = tx - ox, dy = ty - oy;
              boolean[] n = new boolean[4];
              if (Math.hypot(dx, dy) > R * dz) {
                if (snap) {
                  double a = Math.toDegrees(Math.atan2(dy, dx));
                  double h = 6;
                  n[0] = Math.abs(a) > 112.5 - (k[0] ? h : 0);
                  n[1] = Math.abs(a) < 67.5 + (k[1] ? h : 0);
                  n[2] = a < -22.5 + (k[2] ? h : 0) && a > -157.5 - (k[2] ? h : 0);
                  n[3] = a > 22.5 - (k[3] ? h : 0) && a < 157.5 + (k[3] ? h : 0);
                } else {
                  float z = R * dz;
                  n[0] = dx < -z; n[1] = dx > z; n[2] = dy < -z; n[3] = dy > z;
                }
              }
              for (int i = 0; i < 4; i++) if (n[i] != k[i]) { k[i] = n[i]; key(KC[i], n[i]); }
            }
            void relDirs() { for (int i = 0; i < 4; i++) if (k[i]) { k[i] = false; key(KC[i], false); } }
            void releaseAll() { relDirs(); if (kid >= 0) key(KeyEvent.KEYCODE_X, false); jid = kid = -1; }
            float gx() { return getWidth() - 30 * d; }
            float ex() { return getWidth() - 76 * d; }
            float qx() { return getWidth() - 122 * d; }
            float ay() { return 30 * d; }
            float kx() { return lf ? 90 * d : getWidth() - 90 * d; }
            float ky() { return getHeight() - 90 * d; }
            boolean joyZone(float x, float y) { return y > getHeight() * .3f && (lf ? x > getWidth() * .55f : x < getWidth() * .45f); }
            boolean kickZone(float x, float y) { return y > getHeight() * .3f && (lf ? x < getWidth() * .45f : x > getWidth() * .55f); }
            boolean hit(float x, float y, float cx, float cy, float r) { return Math.hypot(x - cx, y - cy) < r; }
            void col(int argb) { p.setColor(argb); p.setAlpha((int) ((argb >>> 24) * al)); }

            /* chips de chat rapido: 3 columnas */
            float chipX(int i) { float w = 92 * d, g = 8 * d; return (getWidth() - (3 * w + 2 * g)) / 2f + (i % 3) * (w + g); }
            float chipY(int i) { return 58 * d + (i / 3) * (44 * d); }
            int chipAt(float x, float y) {
              int n = Math.min(quick.length, 9);
              for (int i = 0; i < n; i++) {
                float cx = chipX(i), cy = chipY(i);
                if (x >= cx && x <= cx + 92 * d && y >= cy && y <= cy + 36 * d) return i;
              }
              return -1;
            }

            @Override public boolean onTouchEvent(MotionEvent e) {
              int a = e.getActionMasked(), idx = e.getActionIndex(), id = e.getPointerId(idx);
              float x = e.getX(idx), y = e.getY(idx);
              switch (a) {
                case MotionEvent.ACTION_DOWN:
                case MotionEvent.ACTION_POINTER_DOWN:
